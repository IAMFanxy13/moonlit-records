[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "moonlit-processor"
version = "0.1.0"
description = "Local-only open-source analysis contracts for Moonlit Records"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]
advanced = [
  "demucs>=4.0.1,<5",
  "openai-whisper>=20240930",
  "whisperx>=3.3,<4",
  "basic-pitch>=0.4,<1",
  "essentia>=2.1b6.dev1110",
  "pyacoustid>=1.3,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["moonlit_processor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
